name: CPU correctness and reproducibility
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -W error tiny_lm.py test
      - run: python -W error -m unittest -v test_workbench
      - run: python -W error workbench.py check results/study.json
      - run: python -W error workbench.py train local-checkpoint.json
      - run: python -W error workbench.py generate local-checkpoint.json --prompt 'the blue rover'
